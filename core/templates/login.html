{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px;">
    <div class="card">
        <h2>Signup for Postify</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="background: #7c3aed; width: 100%;">Create Account</button>
        </form>
        <p style="margin-top: 15px;">Already have account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
