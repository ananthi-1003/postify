<!DOCTYPE html>
<html>
<head>
    <title>Postify Hub - Ananthi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        nav { padding: 15px; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; }
        a { color: #a78bfa; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body class="theme-{{ request.user.profile.theme|default:'dark' }}">
    <nav>
        <h2>Postify Hub</h2>
        <div>
            {% if user.is_authenticated %}
                <span>Hi {{ user.username }}</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Signup</a>
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
