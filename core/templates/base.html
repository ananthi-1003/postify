<!DOCTYPE html>
<html>
<head>
    <title>Postify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .navbar {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar a {
            margin-right: 15px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <div class="navbar">
        <a href="{% url 'feed' %}">Home</a>
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'friends' %}">Friends</a>
        <form method="POST" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" style="background: none; border: none; color: #007bff; cursor: pointer;">Logout</button>
        </form>
        <span style="float: right;">Hi, {{ user.username }}</span>
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
