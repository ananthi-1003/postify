{% extends 'base.html' %}
{% block content %}
<div class="glass" style="max-width: 450px; margin: 80px auto; padding: 40px;">
    <h2 style="text-align: center; margin-bottom: 30px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">Create Account</h2>
    
    {% if form.errors %}
        <div style="background: rgba(255, 0, 0, 0.2); color: white; padding: 12px; border-radius: 12px; margin-bottom: 20px;">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'signup' %}">
        {% csrf_token %}
        <label style="color: white; font-weight: 500;">Username</label><br>
        {{ form.username }}<br><br>
        <label style="color: white; font-weight: 500;">Password</label><br>
        {{ form.password1 }}<br><br>
        <label style="color: white; font-weight: 500;">Confirm Password</label><br>
        {{ form.password2 }}<br><br>
        <button type="submit" class="btn btn-primary" style="width: 100%; background: white; color: #667eea;">Create Account</button>
    </form>
    <br>
    <p style="text-align: center; color: white;">Already have an account? <a href="{% url 'login' %}" style="color: white; font-weight: 600;">Login</a></p>
</div>

<style>
input[type="text"], input[type="password"] {
    width: 100%; padding: 12px; margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px; background: rgba(255, 255, 255, 0.9);
}
.helptext, ul { font-size: 12px; color: #fff; margin-top: -10px; margin-bottom: 15px; }
</style>
{% endblock %}
