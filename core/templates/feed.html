{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h3><i class="fa-solid fa-pen"></i> Create a Post</h3>
    <textarea placeholder="What's on your mind, Ananthi?" style="width:100%; padding:15px; border-radius:8px; border:1px solid #ddd; margin:15px 0;"></textarea>
    <button class="btn">Post</button>
</div>

{% for post in posts %}
<div class="card post-card">
    <b>{{ post.user.username }}</b> - {{ post.created_at }}
    <p style="margin:15px 0;">{{ post.content }}</p>
    <a href="#" style="color:#667eea; text-decoration:none;"><i class="fa-solid fa-heart"></i> Like</a>
</div>
{% endfor %}
{% endblock %}
