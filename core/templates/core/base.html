<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postify</title>
    <style>
        /* DARK THEME - DEFAULT */
        :root {
            --bg-color: #0f0f1a;
            --card-color: #1a1a2e;
            --border-color: #2d2d44;
            --text-color: #e4e4e7;
            --text-light: #a1a1aa;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --input-bg: #0f0f1a;
        }
        
        /* LIGHT THEME */
        body.light-theme {
            --bg-color: #f5f3ff;
            --card-color: #ffffff;
            --border-color: #e4d8ff;
            --text-color: #1f1f1f;
            --text-light: #6b6b6b;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --input-bg: #f5f3ff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }
        
        .navbar {
            background: var(--card-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo {
            font-size: 22px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
        }
        
        .theme-toggle {
            background: var(--accent);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            color: white;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        
        .nav-links a, .nav-links button {
            color: var(--text-color);
            text-decoration: none;
            font-size: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        
        .nav-links a:hover, .nav-links button:hover {
            color: var(--accent);
        }
        
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
            flex: 1;
        }
        
        .login-card, .post-box, .post-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        
        h2 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }
        
        input[type="text"], input[type="password"], textarea, input[type="file"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        
        .text-center {
            text-align: center;
            margin-top: 15px;
            color: var(--text-light);
            font-size: 14px;
        }
        
        .text-center a {
            color: var(--accent);
            text-decoration: underline;
        }
        
        .post-header a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        
        .post-header small {
            color: var(--text-light);
            margin-left: 10px;
        }
        
        /* FOOTER - ANANTHI CREDIT */
        .footer {
            background: var(--card-color);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
            margin-top: auto;
        }
        
        .footer strong {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-section">
                <a href="{% url 'home' %}" class="logo">Postify</a>
                <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
            </div>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'home' %}">Home</a>
                    <a href="{% url 'friends' %}">Friends</a>
                    <a href="{% url 'profile' user.username %}">Profile</a>
                    <!-- LOGOUT FIX - POST METHOD -->
                    <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'signup' %}">Signup</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- FOOTER WITH CREDIT -->
    <footer class="footer">
        This version created by <strong>Ananthi</strong> 💜 | Postify © 2026
    </footer>

    <script>
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('theme-btn').textContent = '☀️';
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            let theme = 'dark';
            let icon = '🌙';
            
            if (document.body.classList.contains('light-theme')) {
                theme = 'light';
                icon = '☀️';
            }
            
            document.getElementById('theme-btn').textContent = icon;
            localStorage.setItem('theme', theme);
        }
    </script>
</body>
</html>
