{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="post-card" style="max-width: 400px; margin: 60px auto;">
    <h2 style="text-align: center; color: var(--accent); margin-bottom: 20px;">Join Postify 💜</h2>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Create Account</button>
    </form>
    
    <p style="text-align: center; margin-top: 15px; color: var(--text-light);">
        Already have account? <a href="{% url 'login' %}" style="color: var(--accent);">Login</a>
    </p>
</div>

<style>
    /* Django form ah azhaga maatha */
    form p {
        margin-bottom: 15px;
    }
    form label {
        display: block;
        margin-bottom: 5px;
        color: var(--text-light);
        font-size: 14px;
    }
    form input {
        width: 100%;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 12px;
        border-radius: 8px;
    }
    .helptext, form ul {
        font-size: 12px;
        color: var(--text-light);
        margin-top: 5px;
    }
</style>
{% endblock %}
